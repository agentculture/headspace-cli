[project]
name = "headspace-cli"
version = "0.8.0"
description = "Headspace is an ephemeral computational workspace for agents. It lets models offload execution, experimentation, and calculation without polluting their reasoning context, then exports only the results and evidence worth retaining."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = [
    # The Docker SDK is the first runtime dependency, per the converged spec's
    # recorded decision (frame headspace-on-docker, q1). Compatible-release
    # bound: probed against engine 29.1.3 / API 1.52 with SDK 7.2.0. Only
    # headspace/providers/docker.py may import it — every other layer talks to
    # the backend-neutral Provider protocol in headspace/providers/base.py.
    "docker>=7.1,<8",
]

[project.urls]
Homepage = "https://github.com/agentculture/headspace-cli"
Issues = "https://github.com/agentculture/headspace-cli/issues"

[project.scripts]
headspace = "headspace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["headspace"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
]

[tool.coverage.run]
source = ["headspace"]
omit = ["headspace/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=headspace (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["headspace"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    # Live-engine tests. They skip cleanly when no Docker socket is reachable,
    # so CI's unit lane never depends on a daemon — but they are slow, and
    # naming the mark lets a developer deselect them with `-m 'not integration'`.
    "integration: exercises a live container engine",
]
